name: docker

# Builds the builder image for linux/amd64 and linux/arm64 on native runners
# (the arm64 build under QEMU would take hours) and publishes one multi-arch tag to ghcr.io.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["docker/**", "zigbee_builder/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-26.04, suffix: amd64}
          - {platform: linux/arm64, runner: ubuntu-26.04-arm, suffix: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the image is about 5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build args from docker/pins.env
        id: pins
        run: |
          . docker/pins.env
          {
            echo 'args<<EOF'
            echo "ZEPHYR_REPO=$ZEPHYR_REPO"
            echo "ZEPHYR_REV=${ZEPHYR_REV%% *}"
            echo "IOT_DRIVERS_REPO=$IOT_DRIVERS_REPO"
            echo "IOT_DRIVERS_REV=${IOT_DRIVERS_REV%% *}"
            echo "TC32_LLVM_TAG=$TC32_LLVM_TAG"
            echo "TC32_LLVM_SHA256_ARM64=$TC32_LLVM_SHA256_ARM64"
            echo "TC32_LLVM_SHA256_AMD64=$TC32_LLVM_SHA256_AMD64"
            echo "MCUBOOT_REPO=$MCUBOOT_REPO"
            echo "MCUBOOT_REV=$MCUBOOT_REV"
            echo "ZEPHYR_SDK_VERSION=$ZEPHYR_SDK_VERSION"
            echo "WEST_PROJECTS=$WEST_PROJECTS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push by digest on non-PR events)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.pins.outputs.args }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.suffix }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.suffix) || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

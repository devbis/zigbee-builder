[project]
name = "zigbee-builder"
version = "0.1.0"
description = "Build Zigbee device firmware (Zephyr) from a YAML description"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jinja2>=3.1", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zigbee-builder = "zigbee_builder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zigbee_builder*"]
[tool.setuptools.package-data]
zigbee_builder = ["data/**/*"]

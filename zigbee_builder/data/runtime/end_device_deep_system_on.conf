# nRF52840 SED deep sleep: idle the CPU in System ON; keep RAM and Zigbee state for in-place resume.
# The RTC-backed Zephyr kernel timer wakes the CPU for parent polling. No System OFF or PM state is selected.
CONFIG_ZIGBEE_ED=y
CONFIG_PM=n
CONFIG_TICKLESS_KERNEL=y
CONFIG_ZIGBEE_SLEEPY=y
CONFIG_ZIGBEE_SLEEPY_DEEP_SYSTEM_ON=y

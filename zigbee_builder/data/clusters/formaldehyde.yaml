# Formaldehyde Concentration (0x042b): MeasuredValue is a single precision fraction (0..1). The stack has no code for it;
# runtime/zbr.c registers the table. The channel is in ppm: the attribute is ppm / 1e6
name: formaldehyde
id: 0x042b
header: zbr.h
register: zbr_register_formaldehyde
kconfig: []
attributes:
  measured_value:
    {id: 0x0000, type: SINGLE_PREC, c_type: float, access: RR, channel: formaldehyde, scale: 1000000, min: 0, max: 0,
     invalid: 0x7FC00000, report: {min: 10s, max: 5min, change: 0}}
  measurement_unit: {id: 0x0008, type: ENUM8, c_type: u8, access: R, const: 0}
  measurement_medium: {id: 0x0009, type: ENUM8, c_type: u8, access: R, const: 0}

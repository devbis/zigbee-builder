name: esp32h2
board: esp32h2_devkitm/esp32h2     # the board with its qualifiers, as west takes it
toolchain: zephyr_sdk              # Zephyr SDK (riscv64-zephyr-elf), not the TC32 LLVM
# swap using move, not the sysbuild default (swap using offset): the stack's OTA (ota.c) writes the image at the
# start of slot 1, and swap using offset looks for it in the second sector, so it would never install one
build: {driver: sysbuild, sb_config: [SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y]}          # one west build --sysbuild: MCUboot, and the app signed for slot 0
roles: [router, end_device]
# No sleepy end device: the stack has no light sleep, and the deep sleep needs retained memory
# the board does not describe (sleep: null). An end device stays awake.
sleep: null
# OTA through MCUboot: slot 1 takes the image, MCUboot swaps it in. Needs the tf-psa-crypto modules.
ota: true
snippet: null
pins:
  format: gpio_number
  node: gpio0
  max: 27
  # SPI flash and USB pins; 8, 9 and 25 are strapping pins (9 is the board's button)
  reserved: [6, 7, 15, 16, 17, 18, 19, 20, 21]
wake: none
# any pin pair is a hardware I2C
i2c_hw: {any: {template: i2c_hw.dtsi.j2}}
led0_node: false                   # the devkit has no gpio-leds node: the overlay makes one
kconfig_all: [CONFIG_MAIN_STACK_SIZE=2048]
# the board's partitions: MCUboot at 0, slot 0 at 0x20000 (1792K)
flash: {loader_end: 0x20000, slot_size: 0x1C0000}
